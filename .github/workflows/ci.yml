name: CI - Check Links, Build & Test

on:
  push:
    branches:
      - main
      - stg
      - dev
  pull_request:
    branches:
      - main
      - stg
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Check Assets/Links, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. TypeScript Typecheck (FE + BE + Shared)
        run: npm run typecheck

      - name: 2. Check All Sprites, Assets & Documentation Links
        run: npm run check:links

      - name: 3. Build Production Bundle (Vite + TSC)
        run: npm run build

      - name: 4. Verify Production Build Output (dist/index.html)
        run: |
          test -f dist/index.html
          echo "✅ dist/index.html generated successfully"

      - name: 5. Run Fishing Engine Automated Test Suite
        run: npm test
